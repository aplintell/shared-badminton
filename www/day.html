<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Shared Badminton</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="img/icons/icon-192.png">
  <link rel="apple-touch-icon" href="img/icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shared Badminton">
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="index.html">&#8592;</a>
    <div class="title-wrap">
      <h1 id="dayTitle">Loading...</h1>
      <input id="dayTitleInput" class="title-input" type="text" hidden>
    </div>
    <button id="renameBtn" class="icon-button" type="button" aria-label="Rename session">&#9998;</button>
  </header>

  <main class="container">
    <div id="emptyState" class="empty-state" hidden>
      <p>Chưa có Set nào.</p>
      <p>Bấm dấu + góc dưới màn hình để thêm Set mới.</p>
    </div>

    <div id="gameList" class="game-list" hidden></div>

    <p id="gameHint" class="game-hint" hidden>Bấm vào đội Thắng, Bấm lại là hủy</p>
  </main>

  <button id="undoDeleteBtn" class="fab fab-undo" type="button" aria-label="Undo delete" hidden>
    <span class="fab-undo-icon" aria-hidden="true">&#8617;</span>
  </button>

  <button id="endDayBtn" class="fab fab-center" type="button" aria-label="Kết Ngày">
    <span class="fab-center-icon" aria-hidden="true">&#127937;</span>
  </button>

  <a id="addGameLink" class="fab" href="#" aria-label="Add game"><span class="fab-plus" aria-hidden="true"></span></a>

  <div id="endDayModal" class="modal-overlay" hidden>
    <div class="modal-card">
      <h2 id="endDayTitle">Kết Ngày</h2>

      <div id="endDayForm">
        <div class="form-group">
          <label for="shuttlecockPrice">Cầu</label>
          <input type="number" id="shuttlecockPrice" inputmode="decimal" min="0" step="any" placeholder="0" enterkeyhint="next">
        </div>
        <div class="form-group">
          <label for="courtPrice">Sân</label>
          <input type="number" id="courtPrice" inputmode="decimal" min="0" step="any" placeholder="0" enterkeyhint="next">
        </div>
        <div class="form-group">
          <label for="waterPrice">Nước</label>
          <input type="number" id="waterPrice" inputmode="decimal" min="0" step="any" placeholder="0" enterkeyhint="go">
        </div>
        <p id="endDayError" class="field-error" hidden></p>
        <div class="modal-actions">
          <button type="button" id="cancelEndDayBtn" class="secondary-button">Cancel</button>
          <button type="button" id="calcEndDayBtn" class="primary-button">Tính Tiền</button>
        </div>
      </div>

      <div id="endDayResult" hidden>
        <div id="settleSummary" class="settle-summary"></div>
        <table class="settle-table">
          <thead>
            <tr>
              <th scope="col" class="col-name">Tên</th>
              <th scope="col" class="col-num">Set</th>
              <th scope="col" class="col-num" aria-label="Tiền sân">
                <svg class="court-icon" viewBox="0 0 24 14" aria-hidden="true">
                  <rect x="0.5" y="0.5" width="23" height="13" rx="1.5" fill="#2e9e5b"/>
                  <g stroke="#ffffff" stroke-width="1">
                    <rect x="2" y="2" width="20" height="10" fill="none"/>
                    <line x1="8" y1="2" x2="8" y2="12"/>
                    <line x1="16" y1="2" x2="16" y2="12"/>
                    <line x1="2" y1="7" x2="8" y2="7"/>
                    <line x1="16" y1="7" x2="22" y2="7"/>
                  </g>
                  <line x1="12" y1="0.5" x2="12" y2="13.5" stroke="#ffffff" stroke-width="1.8"/>
                </svg>
              </th>
              <th scope="col" class="col-num">Thua</th>
              <th scope="col" class="col-num">💧</th>
              <th scope="col" class="col-num col-total">Tổng</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="modal-actions">
          <button type="button" id="shareEndDayBtn" class="primary-button">Share</button>
          <button type="button" id="closeEndDayBtn" class="secondary-button">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div id="shareLoading" class="loading-overlay" role="status" aria-live="polite" hidden>
    <div class="loading-spinner" aria-hidden="true"></div>
    <p>Đang chuẩn bị ảnh...</p>
  </div>

  <script src="js/html2canvas.min.js"></script>
  <script src="js/version.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/vendor/firebase-app-compat.js"></script>
  <script src="js/vendor/firebase-auth-compat.js"></script>
  <script src="js/vendor/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/db.js"></script>
  <script src="js/services.js"></script>
  <script src="js/back-button.js"></script>
  <script src="js/share-image.js"></script>
  <script>
    var dayId = parseInt(new URLSearchParams(window.location.search).get('id'), 10);

    document.getElementById('addGameLink').setAttribute('href', 'game-form.html?dayId=' + dayId);

    var emptyStateEl = document.getElementById('emptyState');
    var gameListEl = document.getElementById('gameList');
    var gameHintEl = document.getElementById('gameHint');
    var undoDeleteBtn = document.getElementById('undoDeleteBtn');

    var playerNameById = {};

    function loadPlayerNames() {
      return Players.findAll().then(function (players) {
        playerNameById = {};
        players.forEach(function (p) {
          playerNameById[p.id] = p.name;
        });
      });
    }

    function formatTimeLabel(isoString) {
      var d = new Date(isoString);
      var hh = d.getHours() < 10 ? '0' + d.getHours() : String(d.getHours());
      var mm = d.getMinutes() < 10 ? '0' + d.getMinutes() : String(d.getMinutes());
      return hh + ':' + mm;
    }

    function buildTeamElement(teamNumber, name1, name2, winningTeam) {
      var team = document.createElement('div');
      team.className = 'team ' + (teamNumber === 1 ? 'team-left' : 'team-right');
      team.setAttribute('data-team', String(teamNumber));
      if (winningTeam === teamNumber) {
        team.classList.add('winner');
      } else if (winningTeam && winningTeam !== teamNumber) {
        team.classList.add('loser');
      }

      var stampWin = document.createElement('span');
      stampWin.className = 'stamp stamp-win';
      stampWin.textContent = '🏆 Lụm';
      var stampLose = document.createElement('span');
      stampLose.className = 'stamp stamp-lose';
      stampLose.textContent = '😭 Lỏ';

      var players = document.createElement('div');
      players.className = 'players';
      [name1, name2].forEach(function (n) {
        var span = document.createElement('span');
        span.textContent = n;
        players.appendChild(span);
      });

      team.appendChild(stampWin);
      team.appendChild(stampLose);
      team.appendChild(players);
      return team;
    }

    function buildGameRowElement(game) {
      var row = document.createElement('div');
      row.className = 'game-row';
      row.setAttribute('data-game-id', String(game.id));

      var bg = document.createElement('div');
      bg.className = 'game-row-bg';
      bg.setAttribute('aria-hidden', 'true');
      bg.textContent = '🗑️ Xóa';
      row.appendChild(bg);

      var content = document.createElement('div');
      content.className = 'game-row-content';

      content.appendChild(buildTeamElement(1, playerNameById[game.team1Player1Id], playerNameById[game.team1Player2Id], game.winningTeam));

      var vsLabel = document.createElement('div');
      vsLabel.className = 'vs-label';
      var vsSpan = document.createElement('span');
      vsSpan.textContent = 'VS';
      vsLabel.appendChild(vsSpan);
      if (game.createdAt) {
        var timeSpan = document.createElement('span');
        timeSpan.className = 'vs-time';
        timeSpan.textContent = formatTimeLabel(game.createdAt);
        vsLabel.appendChild(timeSpan);
      }
      content.appendChild(vsLabel);

      content.appendChild(buildTeamElement(2, playerNameById[game.team2Player1Id], playerNameById[game.team2Player2Id], game.winningTeam));

      row.appendChild(content);
      return row;
    }

    undoDeleteBtn.addEventListener('click', function () {
      undoDeleteBtn.disabled = true;
      Games.undoLastDelete(dayId)
        .then(function () {
          saveModalStateBeforeReload();
          window.location.reload();
        })
        .catch(function () {
          undoDeleteBtn.disabled = false;
          undoDeleteBtn.hidden = true;
          alert('Không còn Set đã Xóa để phục hồi');
        });
    });

    function bindGameRow(row) {
      row.querySelectorAll('.team').forEach(function (el) {
        el.addEventListener('click', function () {
          var gameId = parseInt(row.getAttribute('data-game-id'), 10);
          var clickedTeam = parseInt(el.getAttribute('data-team'), 10);
          var alreadyWinner = el.classList.contains('winner');
          var newWinningTeam = alreadyWinner ? null : clickedTeam;

          Games.getOrThrow(gameId)
            .then(function (game) {
              return Games.setWinner(game, newWinningTeam);
            })
            .then(function () {
              var teams = row.querySelectorAll('.team');
              teams.forEach(function (t) {
                t.classList.remove('winner', 'loser');
                if (newWinningTeam !== null) {
                  var teamNumber = parseInt(t.getAttribute('data-team'), 10);
                  t.classList.add(teamNumber === newWinningTeam ? 'winner' : 'loser');
                }
              });
            })
            .catch(function () {
              alert('Could not save the result. Check your connection and try again.');
            });
        });
      });

      var vsLabel = row.querySelector('.vs-label');

      function duplicateGame() {
        var gameId = parseInt(row.getAttribute('data-game-id'), 10);

        Games.getOrThrow(gameId)
          .then(function (game) {
            return Games.duplicate(game);
          })
          .then(function (newGame) {
            var newRow = buildGameRowElement(newGame);
            gameListEl.insertBefore(newRow, gameListEl.firstChild);
            bindGameRow(newRow);
          })
          .catch(function () {
            alert('Could not duplicate the game. Check your connection and try again.');
          });
      }

      bindRowGestures(row, vsLabel, duplicateGame);
    }

    function bindRowGestures(row, vsLabel, onVsLabelDoubleTap) {
      var content = row.querySelector('.game-row-content');
      var DELETE_THRESHOLD = 90;
      var DOUBLE_TAP_MS = 350;
      var pointerId = null;
      var startX = 0;
      var startY = 0;
      var currentX = 0;
      var dragging = false;
      var moved = false;
      var pointerDownTarget = null;
      var lastVsTapTime = 0;

      row.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) {
          return;
        }
        dragging = true;
        moved = false;
        currentX = 0;
        startX = e.clientX;
        startY = e.clientY;
        pointerId = e.pointerId;
        pointerDownTarget = e.target;
        content.style.transition = 'none';
      });

      row.addEventListener('pointermove', function (e) {
        if (!dragging || e.pointerId !== pointerId) {
          return;
        }
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        if (!moved) {
          if (Math.abs(dx) < 10) {
            return;
          }
          if (Math.abs(dy) > Math.abs(dx)) {
            dragging = false;
            return;
          }
          moved = true;
          try {
            row.setPointerCapture(pointerId);
          } catch (err) {
            // ignore if pointer capture isn't supported for this pointer
          }
        }
        currentX = dx;
        content.style.transform = 'translateX(' + currentX + 'px)';
        row.classList.toggle('swiping', Math.abs(currentX) > 10);
      });

      function endDrag() {
        if (!dragging) {
          return;
        }
        dragging = false;
        content.style.transition = '';
        if (moved) {
          row.dataset.justDragged = '1';
        }
        if (Math.abs(currentX) > DELETE_THRESHOLD) {
          deleteRow(currentX > 0 ? 1 : -1);
        } else {
          content.style.transform = '';
          row.classList.remove('swiping');
          if (!moved && pointerDownTarget && vsLabel.contains(pointerDownTarget)) {
            var now = Date.now();
            if (now - lastVsTapTime < DOUBLE_TAP_MS) {
              lastVsTapTime = 0;
              onVsLabelDoubleTap();
            } else {
              lastVsTapTime = now;
            }
          }
        }
        currentX = 0;
      }

      row.addEventListener('pointerup', endDrag);
      row.addEventListener('pointercancel', endDrag);

      row.addEventListener('click', function (e) {
        if (row.dataset.justDragged) {
          e.stopPropagation();
          e.preventDefault();
          delete row.dataset.justDragged;
        }
      }, true);

      function deleteRow(direction) {
        var gameId = parseInt(row.getAttribute('data-game-id'), 10);
        content.style.transition = 'transform 0.2s ease';
        content.style.transform = 'translateX(' + (direction > 0 ? '100%' : '-100%') + ')';

        Games.getOrThrow(gameId)
          .then(function (game) {
            return Games.delete(game);
          })
          .then(function () {
            undoDeleteBtn.hidden = false;
            setTimeout(function () {
              row.remove();
              if (!gameListEl.querySelector('.game-row')) {
                window.location.reload();
              }
            }, 200);
          })
          .catch(function () {
            alert('Could not delete the game. Check your connection and try again.');
            content.style.transform = '';
            row.classList.remove('swiping');
          });
      }
    }

    var titleEl = document.getElementById('dayTitle');
    var titleInput = document.getElementById('dayTitleInput');
    var renameBtn = document.getElementById('renameBtn');

    function enterEditMode() {
      titleInput.value = titleEl.textContent;
      titleEl.hidden = true;
      titleInput.hidden = false;
      titleInput.focus();
      titleInput.select();
    }

    function saveName() {
      var newName = titleInput.value.trim();
      titleInput.hidden = true;
      titleEl.hidden = false;
      if (!newName || newName === titleEl.textContent) {
        return;
      }
      GameDays.getOrThrow(dayId)
        .then(function (day) {
          return GameDays.rename(day, newName);
        })
        .then(function (day) {
          titleEl.textContent = day.name;
        })
        .catch(function () {
          alert('Could not save the name. Check your connection and try again.');
        });
    }

    renameBtn.addEventListener('click', enterEditMode);
    titleInput.addEventListener('blur', saveName);
    titleInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        titleInput.blur();
      } else if (e.key === 'Escape') {
        titleInput.hidden = true;
        titleEl.hidden = false;
      }
    });

    var endDayBtn = document.getElementById('endDayBtn');
    var endDayModal = document.getElementById('endDayModal');
    var endDayForm = document.getElementById('endDayForm');
    var endDayResult = document.getElementById('endDayResult');
    var endDayError = document.getElementById('endDayError');
    var shuttlecockInput = document.getElementById('shuttlecockPrice');
    var courtInput = document.getElementById('courtPrice');
    var waterInput = document.getElementById('waterPrice');
    var calcEndDayBtn = document.getElementById('calcEndDayBtn');
    var cancelEndDayBtn = document.getElementById('cancelEndDayBtn');
    var closeEndDayBtn = document.getElementById('closeEndDayBtn');
    var shareEndDayBtn = document.getElementById('shareEndDayBtn');
    var endDayTitleEl = document.getElementById('endDayTitle');
    var modalCardEl = document.querySelector('.modal-card');
    var settleSummaryEl = document.getElementById('settleSummary');
    var settleBodyEl = endDayResult.querySelector('.settle-table tbody');
    var shareText = '';

    function formatMoney(n) {
      return Math.round(n).toLocaleString();
    }

    function openEndDayModal() {
      endDayTitleEl.textContent = titleEl.textContent;
      endDayError.hidden = true;
      endDayForm.hidden = false;
      endDayResult.hidden = true;
      endDayModal.hidden = false;
    }

    // The price boxes are saved with the day on every keystroke, so they survive closing the
    // popup, leaving the page, or the app being killed. Writes are chained so an older value
    // can never land after a newer one.
    var priceSaveChain = Promise.resolve();

    function savePrices() {
      var prices = {
        shuttlecock: shuttlecockInput.value,
        court: courtInput.value,
        water: waterInput.value
      };
      priceSaveChain = priceSaveChain
        .then(function () {
          return GameDays.savePrices(dayId, prices);
        })
        .catch(function () {
          // keep going; the next keystroke retries with the latest values
        });
    }

    function fillPrices(prices) {
      if (!prices) {
        return;
      }
      shuttlecockInput.value = prices.shuttlecock || '';
      courtInput.value = prices.court || '';
      waterInput.value = prices.water || '';
    }

    [shuttlecockInput, courtInput, waterInput].forEach(function (input) {
      input.addEventListener('input', savePrices);
    });

    function closeEndDayModal() {
      endDayModal.hidden = true;
    }

    var UNDO_MODAL_STORAGE_KEY = 'badminton-undo-modal-' + dayId;

    function saveModalStateBeforeReload() {
      var state = {
        open: !endDayModal.hidden,
        shuttlecockPrice: shuttlecockInput.value,
        courtPrice: courtInput.value,
        waterPrice: waterInput.value
      };
      try {
        sessionStorage.setItem(UNDO_MODAL_STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        // ignore storage errors (e.g. private browsing)
      }
    }

    function restoreModalStateAfterReload() {
      var raw;
      try {
        raw = sessionStorage.getItem(UNDO_MODAL_STORAGE_KEY);
        sessionStorage.removeItem(UNDO_MODAL_STORAGE_KEY);
      } catch (err) {
        return;
      }
      if (!raw) {
        return;
      }
      var state;
      try {
        state = JSON.parse(raw);
      } catch (err) {
        return;
      }
      shuttlecockInput.value = state.shuttlecockPrice || '';
      courtInput.value = state.courtPrice || '';
      waterInput.value = state.waterPrice || '';
      if (state.open) {
        openEndDayModal();
      }
    }

    // Pictures used in the summary heading in place of words. PNG rather than SVG so the
    // shared image (html2canvas) draws them too.
    var SHUTTLECOCK_ICON = { src: 'img/icons/shuttlecock.png', className: 'shuttle-icon' };
    var COURT_ICON = { src: 'img/icons/court.png', className: 'summary-court-icon' };
    var WATER_ICON = { src: 'img/icons/water-bottle.png', className: 'water-icon' };

    function calculateSettlement() {
      var shuttlecockPrice = parseFloat(shuttlecockInput.value) || 0;
      var courtPrice = parseFloat(courtInput.value) || 0;
      var waterPrice = parseFloat(waterInput.value) || 0;
      endDayError.hidden = true;

      Settlement.settle(dayId, shuttlecockPrice, courtPrice, waterPrice)
        .then(function (data) {
          settleSummaryEl.innerHTML = '';
          var lines = [];

          // The heading area is a table above the players table: short labels (pictures for
          // Cầu / Sân / Nước) on top, the amounts underneath. The text version for sharing keeps
          // the full wording.
          var summaryTable = document.createElement('table');
          summaryTable.className = 'settle-table summary-table';
          var summaryHead = document.createElement('thead');
          var summaryBody = document.createElement('tbody');
          var summaryHeadRow = document.createElement('tr');
          var summaryValueRow = document.createElement('tr');
          summaryHead.appendChild(summaryHeadRow);
          summaryBody.appendChild(summaryValueRow);
          summaryTable.appendChild(summaryHead);
          summaryTable.appendChild(summaryBody);
          settleSummaryEl.appendChild(summaryTable);

          // shortLabel is text, or a picture ({ src, className }).
          function addSummaryColumn(shortLabel, shareLabel, value, shareLine) {
            var th = document.createElement('th');
            th.scope = 'col';
            if (typeof shortLabel === 'object') {
              var img = document.createElement('img');
              img.className = shortLabel.className;
              img.src = shortLabel.src;
              img.alt = '';
              th.appendChild(img);
            } else {
              th.textContent = shortLabel;
            }
            th.setAttribute('aria-label', shareLabel);
            summaryHeadRow.appendChild(th);
            var td = document.createElement('td');
            td.textContent = value;
            summaryValueRow.appendChild(td);
            lines.push(shareLine);
          }

          function addMoneyColumn(shortLabel, shareLabel, amount) {
            addSummaryColumn(shortLabel, shareLabel, formatMoney(amount), shareLabel + ' = ' + formatMoney(amount) + ' 💵');
          }

          addMoneyColumn(SHUTTLECOCK_ICON, 'Cầu', shuttlecockPrice);
          addMoneyColumn(COURT_ICON, 'Sân', courtPrice);
          addMoneyColumn(WATER_ICON, 'Nước', waterPrice);
          addMoneyColumn('Một Set', 'Một Set', data.costPerSlot);
          addMoneyColumn('Thua', 'Thua', data.waterPerLoserSlot);

          function addCell(tr, tag, className, text) {
            var cell = document.createElement(tag);
            cell.className = className;
            cell.textContent = text;
            tr.appendChild(cell);
          }

          settleBodyEl.innerHTML = '';
          data.players.forEach(function (p) {
            var nameLine = p.name + ' : ' + p.gamesPlayed + ' Set - ' + p.gamesLost + ' Thua';
            var amountLine = formatMoney(p.gameShare) + '💰 + ' + formatMoney(p.lostShare) + '💧'
              + ' = ' + formatMoney(p.amount) + '💵';
            var tr = document.createElement('tr');
            addCell(tr, 'th', 'col-name', p.name);
            tr.firstChild.setAttribute('scope', 'row');
            addCell(tr, 'td', 'col-num', String(p.gamesPlayed));
            addCell(tr, 'td', 'col-num', formatMoney(p.gameShare));
            addCell(tr, 'td', 'col-num', String(p.gamesLost));
            addCell(tr, 'td', 'col-num', formatMoney(p.lostShare));
            addCell(tr, 'td', 'col-num col-total', formatMoney(p.amount));
            settleBodyEl.appendChild(tr);
            lines.push(nameLine, amountLine);
          });
          shareText = titleEl.textContent + '\n' + lines.join('\n');
          endDayForm.hidden = true;
          endDayResult.hidden = false;
          // Get the payment QR into the share cache now so Share has less to do later.
          ShareImage.prefetchQr();
        })
        .catch(function (err) {
          endDayError.textContent = err.message;
          endDayError.hidden = false;
        });
    }

    endDayBtn.addEventListener('click', openEndDayModal);
    cancelEndDayBtn.addEventListener('click', closeEndDayModal);
    closeEndDayBtn.addEventListener('click', closeEndDayModal);
    calcEndDayBtn.addEventListener('click', calculateSettlement);

    shuttlecockInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        courtInput.focus();
      }
    });
    courtInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        waterInput.focus();
      }
    });
    waterInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        waterInput.blur();
        calculateSettlement();
      }
    });
    endDayModal.addEventListener('click', function (e) {
      if (e.target === endDayModal) {
        closeEndDayModal();
      }
    });

    var shareLoading = ShareImage.createLoading(document.getElementById('shareLoading'), shareEndDayBtn);

    shareEndDayBtn.addEventListener('click', function () {
      if (typeof html2canvas !== 'function') {
        ShareImage.shareText(titleEl.textContent, shareText);
        return;
      }

      if (shareEndDayBtn.disabled) {
        return;
      }
      shareLoading.show();
      // html2canvas blocks the main thread while it renders, so give the spinner
      // a frame to paint first.
      setTimeout(captureAndShare, 50);
    });

    // Images are rendered one after another rather than in parallel so a long game list
    // and the settlement card never hold full-size canvases in memory at the same time.
    function captureAndShare() {
      var title = titleEl.textContent;
      captureSettlementCard()
        .then(function (cardBlob) {
          if (!cardBlob) {
            throw new Error('Could not render the settlement card');
          }
          return captureGameList().then(function (gamesBlob) {
            var images = [{ blob: cardBlob, fileName: ShareImage.toSafeFileName(title) }];
            if (gamesBlob) {
              images.push({ blob: gamesBlob, fileName: ShareImage.toSafeFileName(title, '-cac-set') });
            }
            return ShareImage.shareImages(images, title, shareLoading.hide);
          });
        })
        .catch(function () {
          shareLoading.hide();
          ShareImage.shareText(title, shareText);
        });
    }

    // The whole list of sets for the day, headed by the day name and set count so the image
    // makes sense on its own in a chat. The header is added to the live list only for the
    // capture — it sits behind the End Day modal, so the user never sees it. Resolves to null
    // (share goes ahead without this image) if the list is empty or fails to render.
    function captureGameList() {
      var rowCount = gameListEl.querySelectorAll('.game-row').length;
      if (gameListEl.hidden || rowCount === 0) {
        return Promise.resolve(null);
      }

      var header = document.createElement('div');
      header.className = 'share-game-header';
      header.textContent = titleEl.textContent + ' · ' + rowCount + ' Set';
      gameListEl.insertBefore(header, gameListEl.firstChild);

      function removeHeader() {
        if (header.parentNode) {
          header.parentNode.removeChild(header);
        }
      }

      var fullHeight = gameListEl.scrollHeight;
      return ShareImage.renderToBlob(gameListEl, {
        backgroundColor: getComputedStyle(document.body).backgroundColor,
        // Keep very long lists under ~8000px tall; bigger canvases fail on some WebViews.
        scale: Math.min(2, 8000 / fullHeight),
        windowHeight: Math.max(document.documentElement.scrollHeight, window.innerHeight)
      }).then(function (blob) {
        removeHeader();
        return blob;
      }, function () {
        removeHeader();
        return null;
      });
    }

    function captureSettlementCard() {
      return ShareImage.renderModalCard(modalCardEl, 'endDayModal', '#endDayResult .modal-actions');
    }

    function loadDay() {
      GameDays.getOrThrow(dayId)
        .then(function (day) {
          titleEl.textContent = day.name;
          fillPrices(day.prices);
          return loadPlayerNames();
        })
        .then(function () {
          return Games.findAllForDay(dayId);
        })
        .then(function (games) {
          gameListEl.innerHTML = '';
          if (games.length === 0) {
            emptyStateEl.hidden = false;
            gameListEl.hidden = true;
            gameHintEl.hidden = true;
          } else {
            emptyStateEl.hidden = true;
            gameListEl.hidden = false;
            gameHintEl.hidden = false;
            games.forEach(function (game) {
              var row = buildGameRowElement(game);
              gameListEl.appendChild(row);
              bindGameRow(row);
            });
          }
          return Games.hasDeletedGames(dayId);
        })
        .then(function (hasDeleted) {
          undoDeleteBtn.hidden = !hasDeleted;
          restoreModalStateAfterReload();
        })
        .catch(function (err) {
          alert(err.message || 'Could not load this day.');
        });
    }

    loadDay();
  </script>
</body>
</html>
